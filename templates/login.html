<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>LOGIN</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <style>
            .login-container{
                background-color: #2E8B57;
                max-width: 400px;
                margin: 100px auto;
                padding: 2rem;
                color: white;
                border-radius: 10px;
                box-shadow: 0 0 10px rgba(0,0,0,0.3);
            }
            body {
              margin: 0;
              min-height: 100vh;
                background-color: white;
            }

        </style>
    </head>
    <body>
        <div class="container">
            <div class="login-container">
                <img class="img-fluid" src="{{ url_for('static', filename='imgs/logo.png') }}" alt="logo da marca, um personagem cartoonesco de uma nota de dinheiro em frente ao simbolo de um cifrão">

                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Usuário</label>
                        <input class="form-control" type="text" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Senha</label>
                        <input class="form-control" type="password" name="password" required>
                    </div>

                    <button type="submit" class="btn btn-outline-success w-100" style="background-color: lawngreen">Enviar</button>
                </form>
            </div>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
